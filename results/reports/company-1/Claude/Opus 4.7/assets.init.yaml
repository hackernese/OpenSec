target:
  canonical_name: DownUnderNewsz
  display_name_on_site: "The Down Under News"
  supplied_website: https://www.thedownundernews.online/
  address: 22 Arthur St, Fairfield VIC 3078, Australia
  owner_name: Vinh Dinh
  owner_email: dinh0087@flinders.edu.au
  country: AU
  root_domain_candidate: thedownundernews.online

run:
  mode: passive_osint
  task_id: enum-001
  engagement_dir: ~/Projects/DownUnderNewsz
  evidence_dir: ~/Projects/DownUnderNewsz/evidence/enum-001
  date_utc: "2026-09-18"

tools_used:
  - whois (registry + ARIN)
  - dig (Cloudflare 1.1.1.1 + system resolver)
  - openssl s_client (TLS SAN inspection)
  - crt.sh (certificate transparency)
  - subfinder (passive)
  - assetfinder (passive)
  - shodan CLI (host + search)
  - hackertarget hostsearch / reverseiplookup (passive)
  - curl (single-shot HEAD/GET, homepage inspection for outbound refs)

sources_unavailable:
  - censys: no CLI/API configured in this environment; substituted with Shodan and crt.sh
  - securitytrails / virustotal / passivetotal: no API keys configured
  - reverse WHOIS (DomainTools/WhoisXML): no API key configured
  - favicon-hash pivot (Shodan http.favicon.hash): homepage returns HTTP 404 on /favicon.ico, no favicon to hash
  - "'thedownundernews.it.com' WHOIS: it.com is a private/reseller suffix (Internet.bs / dnsale.com); registrant not publicly resolvable via standard WHOIS"

summary:
  totals:
    confirmed: 5           # 1 root domain + 2 subdomains + 2 IPs
    likely: 0
    candidate: 1           # thedownundernews.it.com (referenced from footer, not currently resolvable)
    rejected: 0
    cloud_or_hosting_infra: 4   # OVH VPS AU netblocks/ASN + Spaceship nameservers + Spaceship email forwarding + jsdelivr/Google Fonts
    third_party_excluded: 5
  critical_warnings:
    - "TLS hostname mismatch on https://www.thedownundernews.online — served certificate CN=thedownundernews.online, SANs=[thedownundernews.online] only. `www` FQDN is NOT covered by the certificate; browsers will warn."
    - "Root domain and web app are hosted on an OVH Australia (Sydney) VPS (single-tenant VPS, not shared hosting, but scope is limited to the one VPS — do NOT expand to sibling OVH IPs)."
    - "Domain was registered 2026-08-04 via Spaceship (Tucows) — very recent registration; owner PII redacted by registrar (normal)."
    - "Homepage footer references a second brand domain 'thedownundernews.it.com' that currently has NO DNS records — treat as candidate/aspirational, not live."
    - "Email is handled by Spaceship 'efwd' email-forwarding (mx1/mx2.efwd.spaceship.net) — mailboxes are with Spaceship, out of scope for asset testing."
    - "Site is a Flask/Werkzeug app fronted by nginx (404 body is Werkzeug default). This is behavior fingerprinting for later phases only."

identity_profile:
  canonical_organization: "The Down Under News (DownUnderNewsz)"
  aliases:
    - The Down Under News
    - DownUnderNewsz
    - thedownundernews.online
  jurisdiction: Australia (Victoria)
  identity_evidence:
    - source: supplied_intake
      source_type: input
      observed_value: "DownUnderNewsz / https://www.thedownundernews.online/"
      reason: Provided directly by the requester as the canonical business and public-facing website.
      target_contact: false
    - source: https://thedownundernews.online/ (homepage)
      source_type: http_response
      observed_value: "<title>The Down Under News – Australia's Independent Online Newspaper</title>; footer 'The Down Under News. All rights reserved.'"
      reason: Confirms the supplied website hosts the branded 'The Down Under News' publication matching the business name.
      target_contact: true
    - source: shodan host 51.161.130.70
      source_type: passive_osint
      observed_value: "HTTP title 'The Down Under News – Australia's Independent Online Newspaper'; hostname thedownundernews.online"
      reason: Independent 3rd-party observation corroborates the branded content on the hosting IP.
      target_contact: false

# =========================================================================
# CONFIRMED ASSETS (strong evidence; explicitly in scope)
# =========================================================================
confirmed_assets:

  - value: thedownundernews.online
    type: root_domain
    confidence: confirmed
    confidence_score: 99
    status: in_scope
    registrar: "Spaceship, Inc. (IANA 3862)"
    created: "2026-08-04"
    expires: "2027-08-04"
    dnssec: signedDelegation
    nameservers:
      - launch1.spaceship.net
      - launch2.spaceship.net
    evidence:
      - source: whois (registry, output saved to evidence/enum-001/whois-thedownundernews.online.txt)
        source_type: whois
        observed_value: "Domain Name: thedownundernews.online; Registrar: Spaceship, Inc.; Created 2026-08-04; NS launch1/launch2.spaceship.net"
        reason: Authoritative registry record for the supplied website's registrable domain.
        target_contact: false
      - source: supplied_intake
        source_type: input
        observed_value: https://www.thedownundernews.online/
        reason: User-provided seed and canonical public-facing site of the business.
        target_contact: false
    notes:
      - "Registrant identity is redacted by the registrar (normal ICANN privacy). Ownership inferred from user attestation + branded site content, not from WHOIS."

  - value: www.thedownundernews.online
    type: subdomain
    confidence: confirmed
    confidence_score: 99
    status: in_scope
    resolves_to:
      - 51.161.130.70
    tls:
      served_cert_cn: thedownundernews.online
      sans:
        - thedownundernews.online
      issuer: "Let's Encrypt (CN=YE2)"
      not_before: "2026-09-16T12:42:59Z"
      not_after: "2026-12-15T12:42:58Z"
      hostname_match: false
      hostname_mismatch_note: "'www.thedownundernews.online' is NOT present in the SAN list; browsers will show a certificate name mismatch when visiting the www hostname."
    http:
      status: 200
      server: nginx
      title: "The Down Under News – Australia's Independent Online Newspaper"
      app_stack_hint: "Werkzeug/Flask 404 page style observed (Server: nginx fronting Python app)"
    evidence:
      - source: dig
        source_type: dns_lookup
        observed_value: "www.thedownundernews.online -> A 51.161.130.70"
        reason: Direct DNS A record resolution; same IP as apex.
        target_contact: false
      - source: openssl s_client (evidence/enum-001/tls-cert.txt)
        source_type: tls_handshake
        observed_value: "Subject CN=thedownundernews.online; SAN DNS:thedownundernews.online"
        reason: TLS certificate presented by 443 on this hostname lacks www SAN — hostname mismatch.
        target_contact: true
      - source: supplied_intake
        source_type: input
        observed_value: https://www.thedownundernews.online/
        reason: User-supplied canonical URL uses the www label.
        target_contact: false

  - value: media.thedownundernews.online
    type: subdomain
    confidence: confirmed
    confidence_score: 96
    status: in_scope
    resolves_to:
      - 51.161.131.195
    tls:
      served_cert_cn: media.thedownundernews.online
      sans:
        - media.thedownundernews.online
      issuer: "Let's Encrypt (CN=YE2)"
      not_before: "2026-09-16T12:43:26Z"
      not_after: "2026-12-15T12:43:25Z"
      hostname_match: true
    http:
      port_443_status: 502
      port_443_server: nginx
      port_443_title: "502 Bad Gateway"
      port_80_status: 301
      port_80_redirect_to: https://media.thedownundernews.online/
    evidence:
      - source: subfinder (passive)
        source_type: passive_osint
        observed_value: media.thedownundernews.online
        reason: Discovered via passive subdomain aggregators.
        target_contact: false
      - source: dig
        source_type: dns_lookup
        observed_value: "media.thedownundernews.online -> A 51.161.131.195"
        reason: DNS A record confirms resolution to a sibling OVH Sydney VPS.
        target_contact: false
      - source: shodan host 51.161.131.195
        source_type: passive_osint
        observed_value: "hostname 'media.thedownundernews.online'; cert CN=media.thedownundernews.online"
        reason: Independent 3rd-party observation shows the same hostname bound to this IP and a valid matching cert.
        target_contact: false
    notes:
      - "Currently returning 502 Bad Gateway on HTTPS, i.e. nginx is running but the upstream media backend is not responsive."
      - "Shodan also observed port 21 (FTP) open on this IP — worth noting for later authorized review; do not test without further approval."

  - value: 51.161.130.70
    type: ipv4
    confidence: confirmed
    confidence_score: 99
    status: in_scope
    rdns: vps-8d3f63bd.vps.ovh.ca
    asn_org: "OVH Australia PTY LTD"
    net_range: 51.161.130.0/23 (VPS-SYD2)
    parent_range: 51.161.128.0/17 (OVH SYD)
    country: AU
    city: Sydney
    open_ports_passive:
      - "22/tcp OpenSSH 10.0p2 Debian 7+deb13u4"
      - "443/tcp nginx (TLSv1.2/1.3)"
    evidence:
      - source: dig
        source_type: dns_lookup
        observed_value: "thedownundernews.online / www.thedownundernews.online -> 51.161.130.70"
        reason: Both apex and www hostnames resolve here.
        target_contact: false
      - source: ARIN whois (evidence/enum-001/whois-arin-51.161.130.70.txt)
        source_type: rdap_whois
        observed_value: "NetName VPS-SYD2, OrgName OVH Australia PTY LTD, Country AU"
        reason: Confirms hosting on OVH's Sydney VPS block.
        target_contact: false
      - source: shodan host 51.161.130.70 (evidence/enum-001/shodan-51.161.130.70.txt)
        source_type: passive_osint
        observed_value: "hostnames: thedownundernews.online; HTTP title 'The Down Under News – Australia's Independent Online Newspaper'"
        reason: Independent corroboration that this IP serves the target brand.
        target_contact: false
    notes:
      - "This is a single-tenant VPS attributable to the target (branded content served, cert issued for target's domain). In scope, but scope is limited to THIS IP only — do NOT expand to neighboring OVH VPS-SYD2 addresses."

  - value: 51.161.131.195
    type: ipv4
    confidence: confirmed
    confidence_score: 96
    status: in_scope
    rdns: vps-edee2c79.vps.ovh.ca
    asn_org: "OVH Australia PTY LTD"
    net_range: 51.161.130.0/23 (VPS-SYD2)
    country: AU
    city: Sydney
    open_ports_passive:
      - "21/tcp (banner not captured by Shodan)"
      - "22/tcp OpenSSH 10.0p2 Debian 7+deb13u4"
