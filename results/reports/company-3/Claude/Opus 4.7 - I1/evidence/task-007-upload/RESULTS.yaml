methodology:
  safe_operations_performed:
    - upload_validation_tests: true
    - file_magic_inspection: true
    - filename_pattern_testing: true
    - mime_type_acceptance: true
    - size_limit_testing: true
    - file_retrieval_inspection: true
  
  operations_not_performed:
    - php_execution_attempts: out of scope (prevented by design)
    - s3_credential_extraction: out of scope
    - cross_user_access: out of scope
