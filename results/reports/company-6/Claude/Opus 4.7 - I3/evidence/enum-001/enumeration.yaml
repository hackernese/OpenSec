business: AuSecurity

confirmed_assets:
  - asset: ausecurity.best
    type: domain
    evidence: >-
      User-supplied root domain. WHOIS confirms registration via Spaceship, Inc.
      (Creation 2026-08-04, privacy-protected registrant). DNS SOA/NS at
      launch{1,2}.spaceship.net. Live site content is clearly branded
      "Ausecurity — GRC Consulting & Penetration Testing" and lists the
      Sydney/NSW presence consistent with the engagement brief.
      Files: whois_ausecurity_best.txt, dns_full.txt, https_body_root.html,
      https_headers_root.txt
    confidence: 1.0

  - asset: www.ausecurity.best
    type: subdomain
    evidence: >-
      Resolves to 51.79.166.148 (same host as apex). Serves identical
      "Ausecurity" marketing site over HTTPS (nginx/1.22.1), 200 OK.
      Files: dnsx_resolve.txt, httpx_probe.txt
    confidence: 1.0

  - asset: blog.ausecurity.best
    type: subdomain
    evidence: >-
      Found via subfinder/assetfinder passive sources and certspotter CT
      issuances. Let's Encrypt cert SAN=blog.ausecurity.best (issuer YE1).
      WordPress 7.1.2 instance titled "AuSecurity" on Apache/2.4.68 (Debian);
      wp-json/wp/v2/users exposes author "admin".
      Files: subfinder_subs.txt, certspotter.json, dnsx_resolve.txt,
      httpx_probe.txt, blog_headers.txt, blog_body.html
    confidence: 1.0

  - asset: ticket.ausecurity.best
    type: subdomain
    evidence: >-
      Found via subfinder/assetfinder/certspotter. Let's Encrypt cert
      SAN=ticket.ausecurity.best. Serves osTicket v1.18.4 (PHP 8.2.33 on
      nginx/1.22.1); apex path 302 → /setup/install.php (installer still
      reachable — flag for the vulnerability-assessment phase, not an
      enumeration finding).
      Files: certspotter.json, dnsx_resolve.txt, ticket_headers.txt,
      ticket_body.html
    confidence: 1.0

  - asset: https://ausecurity.best/
    type: other
    evidence: >-
      Primary marketing site. nginx/1.22.1, 200 OK, title "Ausecurity — GRC
      Consulting & Penetration Testing". TLS cert on 443 is SELF-SIGNED
      (CN=ausecurity.best, issuer=self, notBefore=2026-09-14).
      Files: https_headers_root.txt, https_body_root.html, tls_cert_summary.txt
    confidence: 1.0

  - asset: https://www.ausecurity.best/
    type: other
    evidence: "Same content/host as apex (51.79.166.148). File: httpx_probe.txt"
    confidence: 1.0

  - asset: https://blog.ausecurity.best/
    type: other
    evidence: "WordPress 7.1.2 on Apache/2.4.68 (Debian). File: httpx_probe.txt, blog_headers.txt"
    confidence: 1.0

  - asset: https://ticket.ausecurity.best/
    type: other
    evidence: "osTicket 1.18.4 installer wizard reachable. File: ticket_body.html"
    confidence: 1.0

  - asset: 51.79.166.148
    type: ip
    evidence: >-
      A record for ausecurity.best and www.ausecurity.best. OVH SAS (AS16276)
      Singapore VPS; rDNS vps-10f1e4c3.vps.ovh.ca. This is a dedicated VPS
      (OVH per-VM naming convention, not a CDN/shared-pool). Attributed to the
      business as the host running their site, while the netblock itself is
      hoster-owned.
      Files: dns_full.txt, ipinfo_51.79.166.148.json, cymru_148.txt
    confidence: 0.9

  - asset: 51.79.166.209
    type: ip
    evidence: >-
      A record for ticket.ausecurity.best. OVH SG VPS (vps-91287016.vps.ovh.ca,
      AS16276). Shodan: 22/tcp OpenSSH 9.2p1 Debian. Dedicated VPS attributed
      to the business.
      Files: dnsx_resolve.txt, shodan_host_51.79.166.209.txt, cymru_209.txt
    confidence: 0.9

  - asset: 51.79.167.208
    type: ip
    evidence: >-
      A record for blog.ausecurity.best. OVH SG VPS (vps-d64a720c.vps.ovh.ca,
      AS16276). Shodan hostnames include blog.ausecurity.best. Dedicated VPS
      attributed to the business.
      Files: dnsx_resolve.txt, shodan_host_51.79.167.208.txt, cymru_208.txt
    confidence: 0.95

  - asset: info@ausecurity.best
    type: email
    evidence: >-
      Published contact address on https://ausecurity.best/ (contact page).
      NOTE: ausecurity.best has NO MX, SPF, DMARC, DKIM or MTA-STS records —
      mail delivery to this address is unlikely to succeed and the domain is
      currently spoof-friendly (worth flagging in the assessment phase, not
      enumeration).
      Files: emails_root.txt, dns_full.txt
    confidence: 0.95

