<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – The Down Under News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body class="login-body">

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <span class="logo-the">THE</span>
        <span class="logo-title">Down Under</span>
        <span class="logo-sub">NEWS</span>
      </div>
      <h1 class="login-title">Admin Panel</h1>
      <p class="login-subtitle">Sign in to manage content</p>
    </div>

    

    <form method="post" action="/admin/login" class="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username or Email</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input
            type="text"
            id="username"
            name="username"
            required
            autocomplete="username"
            placeholder="Enter your username or email"
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
          />
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show/hide password">
            <i class="bi bi-eye" id="passwordToggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>

    <div class="login-footer">
      <a href="/" class="login-back-link">
        <i class="bi bi-arrow-left"></i> Back to website
      </a>
    </div>
  </div>
</div>

<script>
const toggle = document.getElementById('passwordToggle');
const passInput = document.getElementById('password');
const passIcon = document.getElementById('passwordToggleIcon');
if (toggle) {
  toggle.addEventListener('click', () => {
    const isText = passInput.type === 'text';
    passInput.type = isText ? 'password' : 'text';
    passIcon.className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
  });
}
</script>
</body>
</html>
