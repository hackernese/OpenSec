services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imager_app
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - imager_net

  db:
    image: postgres:15-alpine
    container_name: imager_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-imager}
      POSTGRES_USER: ${DB_USER:-imager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-imager} -d ${DB_NAME:-imager}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - imager_net

volumes:
  db_data:
  uploads_data:

networks:
  imager_net:
    driver: bridge
