# =============================================================================
# The Down Under News – Docker Compose
# Domain: thedownundernews.it.com
#
# Services:
#   db  – PostgreSQL 16
#   app – Flask / Gunicorn (Python)
#
# NOTE: Media files are stored on an external FTP server.
#       Configure MEDIA_SERVER_URL in .env.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: downunder_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-newspaper_db}
      POSTGRES_USER:     ${DB_USER:-news_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-news_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-news_user} -d ${DB_NAME:-newspaper_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - downunder_net

  # ---------------------------------------------------------------------------
  # Flask / Gunicorn Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: downunder_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV:   ${FLASK_ENV:-production}
      SECRET_KEY:  3da6484f-b4a9-4d39-88fa-a3e5fdd4b8e8
      JWT_SECRET_KEY: e43069d8-e026-4911-99bf-10273984e4f9

      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-newspaper_db}
      DB_USER:     ${DB_USER:-news_user}
      DB_PASSWORD: ${DB_PASSWORD:-news_pass}

      APP_URL:              ${APP_URL:-https://thedownundernews.online}
      CORS_ORIGINS:         ${CORS_ORIGINS:-https://thedownundernews.online}

      FTP_HOST:             ${FTP_HOST:-}
      FTP_PORT:             ${FTP_PORT:-21}
      FTP_USER:             ${FTP_USER:-}
      FTP_PASSWORD:         ${FTP_PASSWORD:-}
      FTP_USE_TLS:          ${FTP_USE_TLS:-false}
      FTP_UPLOAD_DIR:       ${FTP_UPLOAD_DIR:-/uploads}
      MEDIA_BASE_URL:       ${MEDIA_BASE_URL:-}

      SMTP_HOST:     ${SMTP_HOST:-localhost}
      SMTP_PORT:     ${SMTP_PORT:-587}
      SMTP_USER:     ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM:     ${MAIL_FROM:-noreply@thedownundernews.online}

      PORT: 5000
    ports:
      - "${APP_PORT:-0.0.0.0:5000}:5000"
    volumes:
      # Mount app code for local development hot-reload (remove in pure prod)
      - .:/app:ro
    networks:
      - downunder_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# =============================================================================
# Volumes & Networks
# =============================================================================
volumes:
  postgres_data:
    driver: local

networks:
  downunder_net:
    driver: bridge
