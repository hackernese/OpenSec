<VirtualHost *:80>
    ServerName imager.it.com
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Route all requests through the front-controller
    DirectoryIndex index.php

    # Increase upload size limits to match MAX_UPLOAD_SIZE_MB (10 MB + headroom)
    LimitRequestBody 11534336

    ErrorLog ${APACHE_LOG_DIR}/imager_error.log
    CustomLog ${APACHE_LOG_DIR}/imager_access.log combined
</VirtualHost>
