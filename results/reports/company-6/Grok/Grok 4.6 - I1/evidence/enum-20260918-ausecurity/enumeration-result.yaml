warnings:
  - Apex TLS is self-signed (CN/SAN ausecurity.best only). www and contact use that cert and fail name/trust checks.
  - Historical CT shows Let's Encrypt for ausecurity.best and blog.ausecurity.best; live apex currently presents self-signed.
  - No MX, SPF, or DMARC records. Mail to info@ausecurity.best has no dedicated mail infrastructure.
  - Entire OVH netblocks are provider-owned. Do not expand scope to neighbouring IPs.
  - Spaceship nameservers resolve to Cloudflare IPs; registrar/DNS/CDN are third-party.
  - Lookalike domains ausecurity.com, ausecurity.com.au, and ausecurity.net belong to other organisations.
  - Ticket apex HTTP 302 Location /setup/install.php observed on root GET; path was not followed.
  - Same-origin paths /login, /dashboard, /api/auth/*, /api/contact observed in main.js; not probed (no content discovery).
  - Shodan indexed blog IP with unrelated CVE banners; those are not enumeration assets or confirmed findings.
  - Local resolver timeouts occurred for some lookalike TLD queries (e.g. ausecurity.au).
  - Authorization header values were not stored.
