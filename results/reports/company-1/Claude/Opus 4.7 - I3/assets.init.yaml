technology_fingerprint:
  edge_proxy:
    software: nginx
    version: "unknown (banner stripped to 'nginx' only)"
    evidence: "Server: nginx on every response (200/301/404/401/502)."
  application_framework:
    software: "Python Flask (Werkzeug)"
    confidence: 90
    evidence:
      - "404 body is the exact Werkzeug default: '<!doctype html><html lang=en><title>404 Not Found</title>...'"
      - "Status strings include 'NOT FOUND' / 'UNAUTHORIZED' in uppercase (Werkzeug default phrasing)."
      - "No framework-specific headers (no X-Powered-By, no Set-Cookie observed on anonymous GET)."
  frontend:
    - "Hand-written HTML + CSS + vanilla JS (/static/css/style.css, /static/js/main.js)"
    - "Bootstrap Icons 1.11.3 via jsDelivr"
    - "Google Fonts: Playfair Display, Source Sans 3, Inter"
    - "No build-tool fingerprints (no __NEXT_DATA__, _nuxt, Astro islands, WordPress wp-*, Ghost, Drupal, Joomla, Shopify)."
  cms_detected: "None — appears to be a custom Flask application (not WordPress/Ghost/etc.)."
  cdn_waf:
    cdn: "None in front of the origin (direct OVH IPs; no Cloudflare/Fastly/Akamai/Cloudfront signatures)."
    waf: "No WAF signatures observed."
  media_host:
    software: nginx
    features: "Autoindex ENABLED on /images/ (directory listing)."
  tls:
    issuer: "Let's Encrypt (YE1 for www, YE2 for media)"
    versions: "TLS 1.2 + TLS 1.3 only (SSLv2/v3/TLS1.0/1.1 disabled) — good."
    hsts: "Not observed on responses captured."
    cert_san_gap: "Apex 'thedownundernews.online' is NOT in the cert SAN (only 'www.thedownundernews.online'); strict clients get hostname-mismatch on apex."

