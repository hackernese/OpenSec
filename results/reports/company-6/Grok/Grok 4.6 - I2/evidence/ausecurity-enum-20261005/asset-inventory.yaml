warnings:
  - Street address 63 Paddington St, Paddington NSW 2021 was not published on the crawled official pages; site only says Sydney, NSW.
  - Published ABN 00 000 000 000 is a placeholder; ASIC identity could not be corroborated.
  - About page claims founded 2009 / 15+ years, but ausecurity.best was created 2026-08-04.
  - About-page staff names do not include supplied owner Vinh Dinh.
  - Apex/www/contact TLS is self-signed (CN=ausecurity.best, BasicConstraints CA:TRUE). www and contact have certificate hostname mismatch.
  - ticket.ausecurity.best currently serves an osTicket installer at /setup/install.php.
  - blog.ausecurity.best is a default WordPress install ("Hello world!").
  - No MX/TXT/SPF/DMARC on ausecurity.best; mail for info@ausecurity.best is unpublished in DNS.
  - WHOIS registrant is privacy-proxied (US/Delaware privacy service); cannot independently match owner name.
  - Do not expand scope from OVH VPS IP, OVH netblock 51.79.128.0/17, Spaceship/Cloudflare NS, Google Fonts, WordPress.org, or Let's Encrypt co-tenancy.
  - Lookalike domains (especially ausecurity.com.au) belong to other businesses.

