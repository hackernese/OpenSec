    evidence:
      - source: dig
        source_type: dns_lookup
        observed_value: "media.thedownundernews.online -> 51.161.131.195"
        reason: DNS A record for confirmed target subdomain.
        target_contact: false
      - source: ARIN whois (evidence/enum-001/whois-arin-51.161.131.195.txt)
        source_type: rdap_whois
        observed_value: "OVH Australia PTY LTD / VPS-SYD2 / AU / Sydney"
        reason: Same OVH Sydney VPS block as the primary web IP.
        target_contact: false
      - source: shodan host 51.161.131.195 (evidence/enum-001/shodan-51.161.131.195.txt)
        source_type: passive_osint
        observed_value: "cert CN=media.thedownundernews.online"
