warnings:
  - >
    Official pages repeatedly claim publication domain thedownundernews.it.com
    and publish @thedownundernews.it.com contact mailboxes, but the name is
    currently NXDOMAIN at the it.com parent and has no Certificate Transparency
    issuances. Treat as a claimed identity, not a live website.
  - >
    Apex https://thedownundernews.online/ serves the same HTML as www, but the
    live certificate SAN is only DNS:www.thedownundernews.online. curl with
    certificate verification fails; httpx-toolkit does not verify TLS by default.
  - >
    media.thedownundernews.online resolves and presents a dedicated certificate
    but currently returns nginx 502 Bad Gateway on HTTP/HTTPS.
  - >
    51.161.130.70 and 51.161.131.195 sit in OVH Australia VPS-SYD2
    51.161.130.0/23 (announced as 51.161.128.0/17, AS16276). The /23 and /17
    are provider netblocks, not organization-owned address space.
  - >
    PTR names vps-8d3f63bd.vps.ovh.ca and vps-edee2c79.vps.ovh.ca are OVH
    infrastructure labels, not organization domains.
  - >
    Do not expand scope from Spaceship registrar/NS/MX, Cloudflare-hosted
    Spaceship nameserver IPs, jsDelivr, Google Fonts, Let's Encrypt, it.com,
    Flinders University, Google Maps, or social share endpoints.
  - No port scanning was performed. Open-port notes below are Shodan passive observations only.
  - robots.txt, sitemap.xml, security.txt, /privacy and /terms returned 404 on www.
  - No IPv6 (AAAA) records observed for organization hostnames.

