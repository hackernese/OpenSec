critical_and_high_findings:
  - finding_id: F001
    host: ticket.ausecurity.best
    severity: HIGH
    template_id: osticket-installer
    name: osTicket Installer Panel - Detect
    matched_at: https://ticket.ausecurity.best/setup/install.php
    description: |
      osTicket installation panel is publicly accessible. This indicates either:
      1. Installation not completed or removed properly
      2. Installer directory left in production
      3. Potential for complete system compromise
    business_impact: Critical - Allows unauthenticated system configuration, database reset, and full application takeover
    recommendation: |
      - Immediately remove /setup directory from production
      - Verify osTicket installation is complete
      - Implement .htaccess or nginx rules to block setup access
      - Review osTicket version and apply latest security patches

