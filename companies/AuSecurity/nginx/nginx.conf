worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Serve static frontend files
        # try_files resolves clean URLs: /login → login.html, /dashboard → dashboard.html
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Admin routes — clean URLs with security headers
        location = /login {
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Frame-Options "DENY" always;
            try_files /login.html =404;
        }

        location = /dashboard {
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Frame-Options "DENY" always;
            try_files /dashboard.html =404;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            
            # Add AuthorizedCode header to response if IsAuthorized header is true
            set $authorized_code "";
            if ($http_isauthorized = "true") {
                set $authorized_code "SSBBR1JFRSBUTyBBTExPVyBDTEFXU0VDIFRPIFBFUkZPUk0gQSBGVUxMLVNDT1BFRCBWVUxORVJBQklMSVRZIEFTU0VTU01FTlQgT04gTVkgQ09NUEFOWSBBTkQgTVkgQVNTRVRTLgo=";
            }
            add_header AuthorizedCode $authorized_code always;
        }
    }
}
