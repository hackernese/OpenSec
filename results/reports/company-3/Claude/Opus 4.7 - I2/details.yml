untested_areas_and_limitations:
  - No credential brute-force / password spraying was performed (prohibited by scope); rate-limiting and lockout controls are therefore documented as absent based on observation of 10 non-destructive requests, not on an actual guessing attempt.
  - The exposed AWS keys were NOT used by the assessor against the AWS account; validity was confirmed solely by matching the exposed Access Key ID with the one the live application places in its own pre-signed URLs.
  - The /api/v1/* surface could not be exercised beyond /auth/login and /health because the Apache stack strips the Authorization header before PHP (documented as its own finding). JWT secret strength and API-level BOLA could therefore not be tested with real tokens.
  - PostgreSQL on 5432 was banner-grabbed only; no login attempts were made.
  - No DoS, ReDoS, zip-bomb, or availability-impacting tests were run.
  - The second S3 bucket "imagesharer" in ap-northeast-1 was probed only for anonymous read/list (both denied); its policy and object inventory are not known.
  - CloudFront, Spaceship DNS, Google static CDN, and OVH neighbour IPs were explicitly excluded.

