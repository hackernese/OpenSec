  warnings:
    - Domain imagesharer.xyz is newly registered (2026-09-06); passive subdomain/CT sources lag.
    - Public WHOIS/RDAP does not publish a registrant name; identity rests on supplied website plus live brand match.
    - Google Maps listing alias FShare is a lead only — not treated as a confirmed Imagur asset.
    - Owner email dinh0087@flinders.edu.au is a Flinders University mailbox (third-party); attribution only, not a company mail asset.
