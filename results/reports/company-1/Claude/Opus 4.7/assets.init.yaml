# =========================================================================
# CLOUD / CDN / HOSTING INFRASTRUCTURE
# (Attributable to the target's stack but NOT owned by the target — do NOT test)
# =========================================================================
cloud_and_infrastructure:

  - value: OVH Australia PTY LTD (Sydney)
    type: hosting_provider
    scope: infrastructure_only
    role: "VPS hosting for both web and media IPs (51.161.130.70, 51.161.131.195)"
    net_ranges_observed:
      - 51.161.130.0/23 (VPS-SYD2)
      - 51.161.128.0/17 (OVH SYD)
    evidence:
      - source: ARIN whois
        source_type: rdap_whois
        observed_value: "NetName VPS-SYD2 / OrgName OVH Australia PTY LTD"
        reason: Authoritative allocation record.
        target_contact: false
    notes:
      - "Target-owned scope is the two specific VPS IPs only. Do NOT enumerate or test other OVH-SYD2 tenants."

  - value: "launch1.spaceship.net / launch2.spaceship.net"
    type: authoritative_nameservers
    scope: third_party
    role: DNS hosting for thedownundernews.online
    resolved_ips:
      - 162.159.26.38  (launch1)
      - 162.159.27.32  (launch2)
    evidence:
      - source: whois + dig
        source_type: dns_lookup
        observed_value: "NS records for thedownundernews.online"
        reason: Delegated authoritative DNS provided by Spaceship (Tucows).
        target_contact: false
    notes:
      - "Spaceship nameservers front-ended by Cloudflare IP space (162.159.0.0/16). Out of scope."

  - value: "mx1.efwd.spaceship.net / mx2.efwd.spaceship.net"
    type: mail_infrastructure
    scope: third_party_mail_forwarding
    role: Inbound email forwarding for @thedownundernews.online
    resolved_ips:
      - 162.255.118.11
      - 162.255.118.12
    spf: "v=spf1 include:spf.efwd.spaceship.net ~all"
    evidence:
      - source: dig MX + TXT
        source_type: dns_lookup
        observed_value: "MX -> mx1/mx2.efwd.spaceship.net; SPF include spf.efwd.spaceship.net"
        reason: Mailflow is delegated to Spaceship's email-forwarding service.
        target_contact: false
    notes:
      - "Mailboxes/mail server are operated by Spaceship. Out of scope for asset testing."

  - value: cdn.jsdelivr.net
    type: cdn_third_party_js
    scope: third_party
    role: "Serves bootstrap-icons CSS via <link> on the homepage"
    evidence:
      - source: homepage HTML
        source_type: http_response
        observed_value: "<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css\">"
        reason: Public CDN reference.
        target_contact: true
    notes:
      - "Public CDN, not owned by the target. Out of scope."

  - value: "fonts.googleapis.com / fonts.gstatic.com"
    type: third_party_web_fonts
    scope: third_party
    role: Google Fonts (Playfair Display, Source Sans 3)
    evidence:
      - source: homepage HTML
        source_type: http_response
        observed_value: "<link href=\"https://fonts.googleapis.com/css2?family=Playfair+Display...\">"
        reason: Referenced as font source.
        target_contact: true
    notes:
      - "Google service. Out of scope."

# =========================================================================
# THIRD-PARTY EXCLUSIONS
# =========================================================================
third_party_excluded:
  - Spaceship (registrar, nameservers, email forwarding)
  - OVH Australia (VPS hosting provider — infrastructure only; only the two IPs above are in scope)
  - Cloudflare (Spaceship nameservers are hosted on Cloudflare IP space)
  - jsdelivr.net
  - Google Fonts (googleapis.com / gstatic.com)
  - Let's Encrypt (TLS certificate issuer)
  - Flinders University (owner_email is @flinders.edu.au — university out of scope; used for identity only)

# =========================================================================
# DNS / MAIL SNAPSHOT
# =========================================================================
dns_records:
  thedownundernews.online:
    A: [51.161.130.70]
    NS: [launch1.spaceship.net, launch2.spaceship.net]
    MX: ["0 mx1.efwd.spaceship.net", "0 mx2.efwd.spaceship.net"]
    TXT: ["v=spf1 include:spf.efwd.spaceship.net ~all"]
    SOA: "launch1.spaceship.net support.spaceship.com 1788622483 43200 3600 604800 3600"
    CAA: []
    DNSSEC: signedDelegation
  www.thedownundernews.online:
    A: [51.161.130.70]
  media.thedownundernews.online:
    A: [51.161.131.195]

warnings:
  - "TLS name mismatch on www.thedownundernews.online — cert covers only apex 'thedownundernews.online'. Recommend re-issuing with SAN [thedownundernews.online, www.thedownundernews.online]."
  - "media.thedownundernews.online returning 502 Bad Gateway — upstream backend unavailable or misconfigured."
  - "No CAA record set — any CA can issue certificates for the domain."
  - "No robots.txt / sitemap.xml / security.txt at web root (all 404)."
  - "Werkzeug default 404 page indicates a Flask app in production; ensure DEBUG mode is disabled (verify later in authorized assessment)."
  - "Domain registered very recently (2026-08-04). Low internet history means passive-OSINT surface is narrow — a repeat scan in 30-90 days may surface additional CT entries."
  - "Only 2 CT entries exist for the apex, and 0 for any subdomain — media.thedownundernews.online cert is not yet visible in crt.sh public logs (may be private/pre-cert delay or ACME log delay). Attribution for media relies on live TLS SAN + DNS + Shodan, all consistent."
  - "thedownundernews.it.com is referenced in the footer but not live — treat as candidate pending owner confirmation."

next_recommended_steps_passive:
  - Ask the owner to confirm ownership and scope of thedownundernews.it.com.
  - Ask the owner if any additional subdomains, staging environments, admin panels, or cloud accounts (S3, GCS, GitHub, etc.) exist that were not surfaced passively.
  - Re-run crt.sh in ~30 days to catch newly-logged certs (domain is fresh).
