warnings:
  - "ausecurity.best serves a self-signed TLS certificate (Issuer=CN=ausecurity.best, valid 2026-09-14 to 2027-09-14) on port 443, even though a valid Let's Encrypt certificate for ausecurity.best was issued on 2026-09-07 (crt.sh id 29414811460). Enumeration performed with TLS verification disabled (`curl -k`, `openssl s_client` without CA validation). Recorded as a warning per operator instruction and as a candidate security-hygiene finding for the assessment phase."
  - "Domain ausecurity.best is very recently registered (2026-08-04) and has no historical passive-DNS footprint; absence of leaked assets in third-party datasets is expected and does not prove exhaustive discovery."
  - "Registrant details are hidden behind Spaceship / WITHHELD FOR PRIVACY LLC. Ownership by the AuSecurity business is inferred from operational content on the site and consistency with the supplied engagement metadata, not from registry records."
  - "Domain has NO MX, SPF, DMARC, DKIM (default/selector1/selector2/google/k1/mail/smtp/mandrill/mailgun) or MTA-STS records. The published contact address info@ausecurity.best therefore has no receiving MTA on the domain's DNS and the domain is fully spoofable via SMTP. This is an enumeration observation for the assessment phase, not a scope claim."
  - "51.79.166.148 and 51.79.166.209 both expose port 8080 as the origin backend behind an nginx/1.22.1 reverse proxy on 443. Response bodies on :8080 confirm they belong to the same services as their fronting hostnames."
  - "blog.ausecurity.best exposes /wp-json/wp/v2/users which discloses WordPress user 'admin' (id=1). Recorded as evidence of the asset; exploitation is out of scope for enumeration."
  - "ticket.ausecurity.best redirects unauthenticated visitors to /setup/install.php serving an unauthenticated osTicket v1.18.4 installer wizard. Recorded as evidence of the asset."
  - "dnsx brute-force against SecLists 20k wordlist appears to have been prematurely terminated by upstream DNS rate-limiting (only 'contact' and 'blog' returned); coverage may be incomplete for uncommon labels."
  - "OVH IP block 51.79.128.0/17 is reallocated to OVH Singapore PTE. LTD; PTR records for all three hosts are generic vps-*.vps.ovh.ca. IP-block ownership is OVH, not AuSecurity — only the individual VPS instances are attributed to AuSecurity."

