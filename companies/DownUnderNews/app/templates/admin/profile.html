{% extends "admin/base.html" %}
{% block title %}My Profile – Admin{% endblock %}
{% block breadcrumb %}<i class="bi bi-chevron-right"></i><span>Profile</span>{% endblock %}

{% block content %}
<div class="page-heading">
  <h1>My Profile</h1>
</div>

<div class="profile-grid">
  <!-- Profile info -->
  <div class="sidebar-panel">
    <h3 class="panel-title"><i class="bi bi-person-circle"></i> Account Details</h3>
    <form id="profileForm" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="profFirstName">First Name</label>
          <input type="text" id="profFirstName" maxlength="100" value="{{ user.first_name or '' }}" />
        </div>
        <div class="form-group">
          <label for="profLastName">Last Name</label>
          <input type="text" id="profLastName" maxlength="100" value="{{ user.last_name or '' }}" />
        </div>
      </div>
      <div class="form-group">
        <label for="profEmail">Email</label>
        <input type="email" id="profEmail" maxlength="255" value="{{ user.email }}" />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" value="{{ user.username }}" disabled class="input-disabled" />
      </div>
      <div class="form-group">
        <label>Role</label>
        <span class="role-badge role-{{ user.role }}">{{ user.role }}</span>
      </div>
      <div id="profileMsg" class="save-message" style="display:none"></div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Save Changes</button>
    </form>
  </div>

  <!-- Change password -->
  <div class="sidebar-panel">
    <h3 class="panel-title"><i class="bi bi-lock"></i> Change Password</h3>
    <form id="passwordForm" novalidate>
      <div class="form-group">
        <label for="currentPw">Current Password</label>
        <input type="password" id="currentPw" required autocomplete="current-password" />
      </div>
      <div class="form-group">
        <label for="newPw">New Password</label>
        <input type="password" id="newPw" required minlength="8" autocomplete="new-password" placeholder="Min. 8 characters" />
      </div>
      <div class="form-group">
        <label for="confirmPw">Confirm New Password</label>
        <input type="password" id="confirmPw" required autocomplete="new-password" placeholder="Repeat new password" />
      </div>
      <div id="pwMsg" class="save-message" style="display:none"></div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-shield-lock"></i> Change Password</button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    first_name: document.getElementById('profFirstName').value.trim(),
    last_name: document.getElementById('profLastName').value.trim(),
    email: document.getElementById('profEmail').value.trim(),
  };
  try {
    const resp = await fetch('/admin/profile', { method: 'PUT', headers: {'Content-Type':'application/json'}, credentials: 'same-origin', body: JSON.stringify(data) });
    const result = await resp.json();
    const msg = document.getElementById('profileMsg');
    if (resp.ok) { msg.textContent = '✓ Profile updated'; msg.className = 'save-message save-success'; }
    else { msg.textContent = '✗ ' + (result.error || 'Update failed'); msg.className = 'save-message save-error'; }
    msg.style.display = 'block';
  } catch(e) { alert('Network error'); }
});

document.getElementById('passwordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPw = document.getElementById('newPw').value;
  const confirmPw = document.getElementById('confirmPw').value;
  const msg = document.getElementById('pwMsg');
  if (newPw !== confirmPw) { msg.textContent = '✗ Passwords do not match'; msg.className = 'save-message save-error'; msg.style.display='block'; return; }
  try {
    const resp = await fetch('/admin/change-password', {
      method: 'POST', headers: {'Content-Type':'application/json'}, credentials: 'same-origin',
      body: JSON.stringify({ current_password: document.getElementById('currentPw').value, new_password: newPw }),
    });
    const result = await resp.json();
    if (resp.ok) { msg.textContent = '✓ Password changed'; msg.className = 'save-message save-success'; document.getElementById('passwordForm').reset(); }
    else { msg.textContent = '✗ ' + (result.error || 'Failed'); msg.className = 'save-message save-error'; }
    msg.style.display = 'block';
  } catch(e) { alert('Network error'); }
});
</script>
{% endblock %}
