    - Spaceship nameservers sit on Cloudflare AS13335. Shared DNS; not Imagur-owned.
    - TLS leaf SAN is only imagesharer.xyz; www and resources names fail strict certificate matching.
    - Shodan on 2026-09-10 still showed default nginx on :80; current HTTP now 301s to HTTPS and serves the Imager app.
    - Lookalike public services imgur.com and fshare.vn were not promoted and should not be scoped.
    - Related names imagur.xyz, imager.xyz, imagesharer.net, fshare.xyz need owner review; no definitive ownership proof.
    - Filename /js/awsvalid.js was seen in login HTML; not fetched. Not sufficient to claim an AWS account/asset.
    - No MX/SPF/DMARC on imagesharer.xyz; company mail is not hosted on this domain.
    - Session cookies were observed during unauthenticated HTTP identity checks and were not stored.

