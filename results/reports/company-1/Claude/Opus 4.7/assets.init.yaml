# =========================================================================
# LIKELY ASSETS (moderate evidence)
# =========================================================================
likely_assets: []

# =========================================================================
# CANDIDATE ASSETS (weak / unverified — needs owner confirmation)
# =========================================================================
candidate_assets:

  - value: thedownundernews.it.com
    type: root_domain (referenced brand alias)
    confidence: candidate
    confidence_score: 45
    status: needs_owner_confirmation
    evidence:
      - source: homepage HTML footer (evidence/enum-001/homepage.html)
        source_type: http_response
        observed_value: "<p>Domain: <a href=\"https://thedownundernews.it.com\">thedownundernews.it.com</a></p>"
        reason: Explicitly linked from the confirmed website footer as an alternate brand domain.
        target_contact: true
      - source: dig (@1.1.1.1)
        source_type: dns_lookup
        observed_value: "no A/AAAA/NS/MX/TXT/CNAME records returned"
        reason: Domain is referenced by the target but currently has NO live DNS zone.
        target_contact: false
      - source: crt.sh
        source_type: certificate_transparency
        observed_value: "0 CT entries for thedownundernews.it.com"
        reason: No TLS certificates ever issued — supports 'not yet provisioned' rather than active infra.
        target_contact: false
      - source: whois it.com
        source_type: whois
        observed_value: "it.com is a private/reseller suffix (registry Intis Telecom / dnsale.com). Sub-registrations under it.com are handled by Internet.bs-family resellers and WHOIS at the second-label is not publicly returned."
        reason: Cannot independently verify current registrant of the sub-registration.
        target_contact: false
    notes:
      - "Referenced by the confirmed site as if it were an owned alternate domain, but has no live DNS. Ask the owner: (a) do you own this? (b) is it in scope? Do not test until confirmed live and owned."

